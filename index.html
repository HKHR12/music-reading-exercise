<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>譜読みマスター - 超中毒性Ver (ヘ音記号修正版)</title>
<style>
  body { 
    background:#101018; color:white; text-align:center; font-family:sans-serif; margin:0; padding:10px;
    transition: background-color 0.1s ease;
    overflow-x: hidden;
  }
  canvas { 
    background:white; border-radius: 8px; margin:10px auto; display: block;
    box-shadow: 0 0 25px rgba(255,255,255,0.15); 
    max-width: 100%; height: auto;
  }
  button { 
    margin:8px; padding:18px 28px; font-size: 20px; font-weight: bold; cursor: pointer;
    background: #4444ff; color: white; border: none; border-radius: 8px;
    transition: 0.15s;
    touch-action: manipulation;
    box-shadow: 0 4px 0 #2222aa;
  }
  button:hover { background: #6666ff; transform: translateY(-2px); box-shadow: 0 6px 0 #2222aa; }
  button:active { transform: translateY(2px); box-shadow: 0 0 0 #2222aa; }
  
  .screen { display: none; }
  .active { display: block; }
  .panel { margin:15px auto; padding: 20px; border: 1px solid #333; border-radius: 12px; background: #1a1a24; max-width: 600px; box-shadow: 0 8px 16px rgba(0,0,0,0.3); }
  .stats-grid { display: flex; justify-content: center; gap: 25px; margin-bottom: 10px; font-weight: bold; font-size: 1.4em; }
  .choice-container { display: flex; justify-content: center; flex-wrap: wrap; max-width: 600px; margin: 0 auto; gap: 5px; }
  .mode-title { font-size: 1.8em; font-weight: bold; margin-bottom: 15px; color: #ffaa00; }
  
  .menu-btn { font-size: 22px; padding: 20px 40px; margin: 10px; width: 85%; max-width: 320px; }
  
  .highscore-text { font-size: 1.1em; color: #ffcc00; font-weight: bold; margin-top: 5px; text-shadow: 0 0 8px rgba(255,204,0,0.4); }

  body.correct-flash-low { background-color: #0b2b0b; }
  body.correct-flash-mid { background-color: #114411; }
  body.correct-flash-high { background-color: #1b661b; }
  body.wrong-flash { background-color: #551111; }
  
  .badge { font-size: 4em; font-weight: bold; margin: 15px 0; text-shadow: 0 0 20px currentColor; display: inline-block; animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
  @keyframes popIn { 0% { transform: scale(0); } 100% { transform: scale(1); } }
</style>
</head>
<body>

<h1>🎶 譜読み練習サイト 🎶</h1>

<div id="screen-home" class="screen active">
  <div class="panel">
    <h2>メインメニュー</h2>
    <p style="font-size: 1.1em; color: #ccc;">練習したい記号とモードを選んでください。</p>
    
    <div style="margin-bottom: 25px;">
      <div style="font-size: 1.2em; font-weight: bold; margin-bottom: 10px;">音部記号の選択：</div>
      <button id="btn-clef-treble" onclick="selectClef('treble')" style="background: #ff55bb; font-size: 20px; padding: 15px 30px;">ト音記号</button>
      <button id="btn-clef-bass" onclick="selectClef('bass')" style="background: #555; font-size: 20px; padding: 15px 30px;">ヘ音記号</button>
      <div id="home-highscore" class="highscore-text">🏆 ハイスコア: 0</div>
    </div>

    <hr style="border-color: #333; margin: 25px 0;">

    <div style="display: flex; flex-direction: column; align-items: center;">
      <button onclick="startGameMode('exam')" class="menu-btn" style="background: #ff4444; box-shadow: 0 4px 0 #aa2222;">🔥 本番開始 (1分半)</button>
      <button onclick="startGameMode('practice')" class="menu-btn" style="background: #22cc22; box-shadow: 0 4px 0 #117711;">✏️ 練習開始 (制限なし)</button>
    </div>
  </div>
</div>

<div id="screen-game" class="screen">
  <div class="panel">
    <div id="game-mode-text" class="mode-title">モード</div>
    <div class="stats-grid">
      <div id="timer-display">残り時間: --</div>
      <div id="score-display">スコア: 0</div>
      <div id="combo-display" style="color: #00ffcc;">コンボ: 0</div>
    </div>
  </div>

  <canvas id="staff" width="600" height="220"></canvas>
  
  <div class="panel">
    <div id="mult-display" style="font-size: 1.2em; font-weight: bold; color: #ffcc00; margin-bottom: 5px; height: 24px;">獲得点数: +10</div>
    <div class="choice-container" id="choices"></div>
  </div>
  
  <button onclick="endGame()" style="background:#555; box-shadow:0 4px 0 #333; font-size: 18px; padding: 12px 24px; margin-top: 15px;">メニューに戻る</button>
</div>

<div id="screen-result" class="screen">
  <div class="panel">
    <h2 style="color: #ffaa00; font-size: 2em; margin-bottom: 5px;">TIME UP!</h2>
    <p id="result-clef-text" style="font-size: 1.2em; color: #aaa; margin: 5px 0;"></p>
    
    <div style="font-size: 1.5em; margin-top: 20px;">最終スコア</div>
    <div id="result-score" style="font-size: 3.5em; font-weight: bold; color: #fff;">0</div>
    <div id="result-highscore-notice" style="color: #ffcc00; font-weight: bold; display: none; margin-bottom: 10px;">🏆 ハイスコア更新！ 🏆</div>
    
    <div>評価ランク</div>
    <div id="result-badge" class="badge">A</div>
    <div id="result-comment" style="font-size: 1.2em; font-weight: bold; color: #aaa; margin-bottom: 25px;">素晴らしい演奏でした！</div>
    
    <div style="display: flex; flex-direction: column; align-items: center; gap: 10px;">
      <button onclick="startGameMode('exam')" style="background: #ff4444; box-shadow: 0 4px 0 #aa2222; width: 85%; max-width: 320px; font-size: 22px; padding: 15px;">🔄 もう一度挑戦する</button>
      <button onclick="showHomeScreen()" style="background: #555; box-shadow: 0 4px 0 #333; width: 85%; max-width: 320px; font-size: 18px; padding: 12px;">🏠 メインメニューへ</button>
    </div>
  </div>
</div>

<script>
let audioCtx = null;
let currentClef = 'treble'; 
let gameMode = 'exam';      
let gameActive = false;
let correctNote = null;

let score = 0;
let timeLeft = 0;
let lastTimestamp = 0;
let comboCount = 0; 

let juiceEffects = [];

// 各音階データの再定義（五線譜上の絶対的なステップ値に修正）
// ト音記号：五線譜の一番下の線（ミ）を基準にステップ数を設定
// ヘ音記号：五線譜の一番下の線（ソ）を基準にステップ数を設定
const NOTES_DATA = [
  {name:"ド", trebleStep: -2, bassStep: 3,  semitone: 0},  // C
  {name:"レ", trebleStep: -1, bassStep: 4,  semitone: 2},  // D
  {name:"ミ", trebleStep: 0,  bassStep: 5,  semitone: 4},  // E
  {name:"ファ",trebleStep: 1,  bassStep: 6,  semitone: 5},  // F
  {name:"ソ", trebleStep: 2,  bassStep: 0,  semitone: 7},  // G
  {name:"ラ", trebleStep: 3,  bassStep: 1,  semitone: 9},  // A
  {name:"シ", trebleStep: 4,  bassStep: 2,  semitone: 11}  // B
];

function initAudio() { 
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); 
}

function showScreen(screenId) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(screenId).classList.add('active');
  gameActive = (screenId === 'screen-game');
}

function showHomeScreen() {
  updateHighscoreDisplay();
  showScreen('screen-home');
}

function updateHighscoreDisplay() {
  const key = `谱読みMaster_v2_highscore_${currentClef}`;
  const highscore = localStorage.getItem(key) || 0;
  document.getElementById('home-highscore').innerText = `🏆 ハイスコア: ${highscore}`;
}

function selectClef(clef) {
  currentClef = clef;
  const trebleBtn = document.getElementById('btn-clef-treble');
  const bassBtn = document.getElementById('btn-clef-bass');
  
  if (clef === 'treble') {
    trebleBtn.style.background = '#ff55bb';
    bassBtn.style.background = '#555';
  } else {
    trebleBtn.style.background = '#555';
    bassBtn.style.background = '#55bbff';
  }
  updateHighscoreDisplay();
}

function startGameMode(mode) {
  initAudio();
  gameMode = mode;
  juiceEffects = [];
  
  const modeText = document.getElementById('game-mode-text');
  const timerDisp = document.getElementById('timer-display');
  const scoreDisp = document.getElementById('score-display');
  const comboDisp = document.getElementById('combo-display');
  const multDisp = document.getElementById('mult-display');
  
  if (gameMode === 'exam') {
    modeText.innerText = "🔥 本番モード";
    modeText.style.color = "#ff4444";
    score = 0;
    comboCount = 0;
    timeLeft = 90.0; 
    timerDisp.innerText = `残り時間: ${timeLeft.toFixed(1)}s`;
    scoreDisp.innerText = `スコア: ${score}`;
    comboDisp.innerText = `コンボ: ${comboCount}`;
    multDisp.innerText = `獲得点数: +10`;
    scoreDisp.style.display = "block";
    comboDisp.style.display = "block";
    multDisp.style.display = "block";
  } else {
    modeText.innerText = "✏️ 練習モード";
    modeText.style.color = "#22cc22";
    timerDisp.innerText = "残り時間: ∞";
    scoreDisp.style.display = "none";
    comboDisp.style.display = "none";
    multDisp.style.display = "none";
  }
  
  showScreen('screen-game');
  generateQuestion();
  
  lastTimestamp = performance.now();
  requestAnimationFrame(gameLoop);
}

function gameLoop(timestamp) {
  if (!gameActive) return;
  
  const dt = timestamp - lastTimestamp;
  lastTimestamp = timestamp;

  if (gameMode === 'exam') {
    timeLeft -= dt / 1000;
    if (timeLeft <= 0) {
      timeLeft = 0;
      document.getElementById('timer-display').innerText = `残り時間: 0.0s`;
      processResult();
      return;
    }
    document.getElementById('timer-display').innerText = `残り時間: ${timeLeft.toFixed(1)}s`;
  }
  
  drawStaff();
  requestAnimationFrame(gameLoop);
}

function processResult() {
  gameActive = false;
  
  const key = `谱読みMaster_v2_highscore_${currentClef}`;
  const oldHigh = parseInt(localStorage.getItem(key) || 0, 10);
  let isNewHigh = false;
  if (score > oldHigh) {
    localStorage.setItem(key, score);
    isNewHigh = true;
  }
  
  document.getElementById('result-clef-text').innerText = currentClef === 'treble' ? "【 ト音記号コース 】" : "【 ヘ音記号コース 】";
  document.getElementById('result-score').innerText = score;
  document.getElementById('result-highscore-notice').style.display = isNewHigh ? "block" : "none";
  
  let rank = "F";
  let color = "#888888";
  let comment = "まずはじっくり練習モードで覚えよう！";
  
  if (score >= 400) { rank = "SSS"; color = "#ff0055"; comment = "神域の譜読み能力！向かうところ敵なしです！"; }
  else
