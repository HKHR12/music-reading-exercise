<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>譜読み練習サイト - Clef Masters</title>
<style>
  body { background:#101018; color:white; text-align:center; font-family:sans-serif; margin:0; padding:20px; }
  canvas { background:white; border-radius: 8px; margin:10px; box-shadow: 0 0 20px rgba(255,255,255,0.1); }
  button { 
    margin:5px; padding:12px 20px; font-size: 16px; cursor: pointer;
    background: #4444ff; color: white; border: none; border-radius: 5px;
    transition: 0.2s;
  }
  button:hover { background: #6666ff; transform: scale(1.05); }
  button:active { transform: scale(0.95); }
  .screen { display: none; }
  .active { display: block; }
  .panel { margin:15px; padding: 15px; border: 1px solid #333; border-radius: 8px; background: #1a1a24; }
  .stats-grid { display: flex; justify-content: center; gap: 20px; margin-bottom: 10px; font-weight: bold; font-size: 1.2em; }
  .choice-container { display: flex; justify-content: center; flex-wrap: wrap; max-width: 600px; margin: 0 auto; }
  .mode-title { font-size: 1.5em; font-weight: bold; margin-bottom: 10px; color: #ffaa00; }
</style>
</head>
<body>

<h1>🎶 譜読み練習サイト 🎶</h1>

<div id="screen-home" class="screen active">
  <div class="panel">
    <h2>メインメニュー</h2>
    <p>練習したい記号とモードを選んでください。</p>
    
    <div style="margin-bottom: 20px;">
      <label style="font-size: 1.1em; font-weight: bold; margin-right: 10px;">音部記号：</label>
      <button id="btn-clef-treble" onclick="selectClef('treble')" style="background: #ff55bb;">ト音記号</button>
      <button id="btn-clef-bass" onclick="selectClef('bass')" style="background: #555;">ヘ音記号</button>
    </div>

    <hr style="border-color: #333; margin: 20px 0;">

    <div style="display: flex; justify-content: center; gap: 20px;">
      <button onclick="startGameMode('exam')" style="background: #ff4444; font-size: 1.2em; padding: 15px 30px;">🔥 本番開始 (1分半制限)</button>
      <button onclick="startGameMode('practice')" style="background: #22cc22; font-size: 1.2em; padding: 15px 30px;">✏️ 練習開始 (制限なし)</button>
    </div>
  </div>
</div>

<div id="screen-game" class="screen">
  <div class="panel">
    <div id="game-mode-text" class="mode-title">モード</div>
    <div class="stats-grid">
      <div id="timer-display">残り時間: --</div>
      <div id="score-display">スコア: 0</div>
      <div id="combo-display">連打: 0</div>
    </div>
  </div>

  <canvas id="staff" width="600" height="220"></canvas>
  
  <div class="panel">
    <div class="choice-container" id="choices"></div>
  </div>
  
  <button onclick="endGame()" style="background:#555;">メニューに戻る</button>
</div>

<script>
let audioCtx = null;
let currentClef = 'treble'; // 'treble' or 'bass'
let gameMode = 'exam';      // 'exam' or 'practice'
let gameActive = false;
let correctNote = null;

// 本番モード用変数
let score = 0;
let timeLeft = 0;
let lastTimestamp = 0;
let comboCount = 0; // 連続正解数をカウントする変数

const NOTES_DATA = [
  {name:"ド", freq:261.63, trebleY:160, bassY:100},
  {name:"レ", freq:293.66, trebleY:150, bassY:90}, 
  {name:"ミ", freq:329.63, trebleY:140, bassY:80}, 
  {name:"ファ", freq:349.23, trebleY:130, bassY:70},
  {name:"ソ", freq:392.00, trebleY:120, bassY:60}, 
  {name:"ラ", freq:440.00, trebleY:110, bassY:50}, 
  {name:"シ", freq:493.88, trebleY:100, bassY:40}  
];

function initAudio() { 
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); 
}

function showScreen(screenId) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(screenId).classList.add('active');
  gameActive = (screenId === 'screen-game');
}

// 記号の選択切り替え
function selectClef(clef) {
  currentClef = clef;
  const trebleBtn = document.getElementById('btn-clef-treble');
  const bassBtn = document.getElementById('btn-clef-bass');
  
  if (clef === 'treble') {
    trebleBtn.style.background = '#ff55bb';
    bassBtn.style.background = '#555';
  } else {
    trebleBtn.style.background = '#555';
    bassBtn.style.background = '#55bbff';
  }
}

// ゲームモード開始
function startGameMode(mode) {
  initAudio();
  gameMode = mode;
  
  const modeText = document.getElementById('game-mode-text');
  const timerDisp = document.getElementById('timer-display');
  const scoreDisp = document.getElementById('score-display');
  const comboDisp = document.getElementById('combo-display');
  
  if (gameMode === 'exam') {
    modeText.innerText = "🔥 本番モード";
    modeText.style.color = "#ff4444";
    score = 0;
    comboCount = 0;
    timeLeft = 90.0; // 制限時間を1分半（90秒）に設定
    timerDisp.innerText = `残り時間: ${timeLeft.toFixed(1)}s`;
    scoreDisp.innerText = `スコア: ${score}`;
    comboDisp.innerText = `コンボ: ${comboCount}`;
    scoreDisp.style.display = "block";
    comboDisp.style.display = "block";
  } else {
    modeText.innerText = "✏️ 練習モード";
    modeText.style.color = "#22cc22";
    timerDisp.innerText = "残り時間: ∞";
    scoreDisp.style.display = "none";
    comboDisp.style.display = "none";
  }
  
  showScreen('screen-game');
  generateQuestion();
  
  if (gameMode === 'exam') {
    lastTimestamp = performance.now();
    requestAnimationFrame(gameLoop);
  }
}

// 本番モード用メインループ
function gameLoop(timestamp) {
  if (!gameActive || gameMode !== 'exam') return;
  
  const dt = timestamp - lastTimestamp;
  lastTimestamp = timestamp;

  timeLeft -= dt / 1000;
  
  if (timeLeft <= 0) {
    timeLeft = 0;
    document.getElementById('timer-display').innerText = `残り時間: 0.0s`;
    
    // 時間切れ時のアラート表示
    alert(`終了！スコアは ${score} です！`);
    endGame();
    return;
  }
  
  document.getElementById('timer-display').innerText = `残り時間: ${timeLeft.toFixed(1)}s`;
  requestAnimationFrame(gameLoop);
}

function endGame() {
  gameActive = false;
  showScreen('screen-home');
}

// 問題生成
function generateQuestion() {
  const base = NOTES_DATA[Math.floor(Math.random() * NOTES_DATA.length)];
  
  // オクターブのランダム要素（-1:低い、0:標準、1:高い）
  let oct = Math.floor(Math.random() * 3) - 1; 

  correctNote = {
    name: base.name,
    freq: base.freq * Math.pow(2, oct),
    y: (currentClef === 'treble' ? base.trebleY : base.bassY) - (oct * 70)
  };
  
  drawStaff();
  
  const div = document.getElementById("choices");
  div.innerHTML = "";
  ["ド","レ","ミ","ファ","ソ","ラ","シ"].forEach(name => {
    const btn = document.createElement("button");
    btn.innerText = name;
    btn.onclick = () => checkAnswer(name);
    div.appendChild(btn);
  });
}

// 五線譜の描画
function drawStaff() {
  const canvas = document.getElementById("staff");
  const ctx = canvas.getContext("2d");
  ctx.clearRect(0,0,600,220);
  ctx.strokeStyle="#333";
  ctx.lineWidth = 2;
  
  // 五線を描画
  for(let i=0; i<5; i++){
    ctx.beginPath(); ctx.moveTo(50, 60+i*20); ctx.lineTo(550, 60+i*20); ctx.stroke();
  }
  
  // 音部記号を描画
  ctx.font="80px serif";
  ctx.fillStyle="black";
  ctx.fillText(currentClef === 'treble' ? "𝄞" : "𝄢", 60, currentClef === 'treble' ? 135 : 115);
  
  // 音符（○）を描画
  ctx.beginPath();
  ctx.fillStyle = "black";
  ctx.ellipse(300, correctNote.y, 10, 7, 0, 0, Math.PI*2);
  ctx.fill();

  // 加線（上・下に追加される線）の描画
  ctx.strokeStyle = "black";
  for(let ly = 160; ly <= correctNote.y; ly += 20) {
    ctx.beginPath(); ctx.moveTo(280, ly); ctx.lineTo(320, ly); ctx.stroke();
  }
  for(let ly = 40; ly >= correctNote.y; ly -= 20) {
    ctx.beginPath(); ctx.moveTo(280, ly); ctx.lineTo(320, ly); ctx.stroke();
  }
}

// 回答判定
function checkAnswer(name) {
  if (name === correctNote.name) {
    playTone(correctNote.freq);
    if (gameMode === 'exam') {
      score += 10; // 正解で10点加算
      comboCount++; // コンボ増加
      
      // 3問連続正解するごとに10秒追加
      if (comboCount === 3) {
        timeLeft += 10.0;
        comboCount = 0; // コンボをリセットして次の3連続へ
      }
      
      document.getElementById('score-display').innerText = `スコア: ${score}`;
      document.getElementById('combo-display').innerText = `コンボ: ${comboCount}`;
    }
  } else {
    if (gameMode === 'exam') {
      score -= 5; // 不正解で5点減点
      if (score < 0) score = 0; // 0点未満にはならない
      comboCount = 0; // 不正解でコンボが途切れる
      
      document.getElementById('score-display').innerText = `スコア: ${score}`;
      document.getElementById('combo-display').innerText = `コンボ: ${comboCount}`;
    }
  }
  // 正解・不正解にかかわらず、次の問題へ移行
  generateQuestion();
}

// 音の再生
function playTone(freq){
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = "sine";
  osc.frequency.value = freq;
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start();
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
  osc.stop(audioCtx.currentTime + 0.5);
}
</script>
</body>
</html>
