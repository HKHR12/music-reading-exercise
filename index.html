<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>譜読み練習サイト - Clef Masters</title>
<style>
  body { 
    background:#101018; color:white; text-align:center; font-family:sans-serif; margin:0; padding:10px;
    transition: background-color 0.15s ease; /* 正解・不正解時の背景フラッシュ用 */
  }
  canvas { 
    background:white; border-radius: 8px; margin:10px auto; display: block;
    box-shadow: 0 0 20px rgba(255,255,255,0.1); 
    max-width: 100%; height: auto; /* スマホの横幅に自動で収まるように */
  }
  button { 
    margin:8px; padding:18px 28px; font-size: 20px; font-weight: bold; cursor: pointer;
    background: #4444ff; color: white; border: none; border-radius: 8px;
    transition: 0.2s;
    touch-action: manipulation; /* スマホでのタップ時のズーム遅延を防止 */
  }
  button:hover { background: #6666ff; transform: scale(1.05); }
  button:active { transform: scale(0.95); }
  .screen { display: none; }
  .active { display: block; }
  .panel { margin:15px auto; padding: 20px; border: 1px solid #333; border-radius: 12px; background: #1a1a24; max-width: 600px; }
  .stats-grid { display: flex; justify-content: center; gap: 25px; margin-bottom: 10px; font-weight: bold; font-size: 1.4em; }
  .choice-container { display: flex; justify-content: center; flex-wrap: wrap; max-width: 600px; margin: 0 auto; gap: 5px; }
  .mode-title { font-size: 1.8em; font-weight: bold; margin-bottom: 15px; color: #ffaa00; }
  
  /* メメインメニュー用の大きなボタン */
  .menu-btn { font-size: 22px; padding: 20px 40px; margin: 10px; width: 85%; max-width: 320px; }
  
  /* 正解・不正解時のエフェクト用クラス */
  body.correct-flash { background-color: #113c11; }
  body.wrong-flash { background-color: #4c1111; }
</style>
</head>
<body>

<h1>🎶 譜読み練習サイト 🎶</h1>

<div id="screen-home" class="screen active">
  <div class="panel">
    <h2>メインメニュー</h2>
    <p style="font-size: 1.1em; color: #ccc;">練習したい記号とモードを選んでください。</p>
    
    <div style="margin-bottom: 25px;">
      <div style="font-size: 1.2em; font-weight: bold; margin-bottom: 10px;">音部記号の選択：</div>
      <button id="btn-clef-treble" onclick="selectClef('treble')" style="background: #ff55bb; font-size: 20px; padding: 15px 30px;">ト音記号</button>
      <button id="btn-clef-bass" onclick="selectClef('bass')" style="background: #555; font-size: 20px; padding: 15px 30px;">ヘ音記号</button>
    </div>

    <hr style="border-color: #333; margin: 25px 0;">

    <div style="display: flex; flex-direction: column; align-items: center;">
      <button onclick="startGameMode('exam')" class="menu-btn" style="background: #ff4444;">🔥 本番開始 (1分半)</button>
      <button onclick="startGameMode('practice')" class="menu-btn" style="background: #22cc22;">✏️ 練習開始 (制限なし)</button>
    </div>
  </div>
</div>

<div id="screen-game" class="screen">
  <div class="panel">
    <div id="game-mode-text" class="mode-title">モード</div>
    <div class="stats-grid">
      <div id="timer-display">残り時間: --</div>
      <div id="score-display">スコア: 0</div>
      <div id="combo-display">コンボ: 0</div>
    </div>
  </div>

  <canvas id="staff" width="600" height="220"></canvas>
  
  <div class="panel">
    <div style="font-size: 1.1em; color: #aaa; margin-bottom: 10px;">正しい音名を選んでね！</div>
    <div class="choice-container" id="choices"></div>
  </div>
  
  <button onclick="endGame()" style="background:#555; font-size: 18px; padding: 12px 24px; margin-top: 15px;">メニューに戻る</button>
</div>

<script>
let audioCtx = null;
let currentClef = 'treble'; 
let gameMode = 'exam';      
let gameActive = false;
let correctNote = null;

// 本番モード用変数
let score = 0;
let timeLeft = 0;
let lastTimestamp = 0;
let comboCount = 0; 

const NOTES_DATA = [
  {name:"ド", freq:261.63, trebleY:160, bassY:100},
  {name:"レ", freq:293.66, trebleY:150, bassY:90}, 
  {name:"ミ", freq:329.63, trebleY:140, bassY:80}, 
  {name:"ファ", freq:349.23, trebleY:130, bassY:70},
  {name:"ソ", freq:392.00, trebleY:120, bassY:60}, 
  {name:"ラ", freq:440.00, trebleY:110, bassY:50}, 
  {name:"シ", freq:493.88, trebleY:100, bassY:40}  
];

function initAudio() { 
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); 
}

function showScreen(screenId) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(screenId).classList.add('active');
  gameActive = (screenId === 'screen-game');
}

function selectClef(clef) {
  currentClef = clef;
  const trebleBtn = document.getElementById('btn-clef-treble');
  const bassBtn = document.getElementById('btn-clef-bass');
  
  if (clef === 'treble') {
    trebleBtn.style.background = '#ff55bb';
    bassBtn.style.background = '#555';
  } else {
    trebleBtn.style.background = '#555';
    bassBtn.style.background = '#55bbff';
  }
}

function startGameMode(mode) {
  initAudio();
  gameMode = mode;
  
  const modeText = document.getElementById('game-mode-text');
  const timerDisp = document.getElementById('timer-display');
  const scoreDisp = document.getElementById('score-display');
  const comboDisp = document.getElementById('combo-display');
  
  if (gameMode === 'exam') {
    modeText.innerText = "🔥 本番モード";
    modeText.style.color = "#ff4444";
    score = 0;
    comboCount = 0;
    timeLeft = 90.0; 
    timerDisp.innerText = `残り時間: ${timeLeft.toFixed(1)}s`;
    scoreDisp.innerText = `スコア: ${score}`;
    comboDisp.innerText = `コンボ: ${comboCount}`;
    scoreDisp.style.display = "block";
    comboDisp.style.display = "block";
  } else {
    modeText.innerText = "✏️ 練習モード";
    modeText.style.color = "#22cc22";
    timerDisp.innerText = "残り時間: ∞";
    scoreDisp.style.display = "none";
    comboDisp.style.display = "none";
  }
  
  showScreen('screen-game');
  generateQuestion();
  
  if (gameMode === 'exam') {
    lastTimestamp = performance.now();
    requestAnimationFrame(gameLoop);
  }
}

function gameLoop(timestamp) {
  if (!gameActive || gameMode !== 'exam') return;
  
  const dt = timestamp - lastTimestamp;
  lastTimestamp = timestamp;

  timeLeft -= dt / 1000;
  
  if (timeLeft <= 0) {
    timeLeft = 0;
    document.getElementById('timer-display').innerText = `残り時間: 0.0s`;
    alert(`終了！スコアは ${score} です！`);
    endGame();
    return;
  }
  
  document.getElementById('timer-display').innerText = `残り時間: ${timeLeft.toFixed(1)}s`;
  requestAnimationFrame(gameLoop);
}

function endGame() {
  gameActive = false;
  showScreen('screen-home');
}

function generateQuestion() {
  const base = NOTES_DATA[Math.floor(Math.random() * NOTES_DATA.length)];
  let oct = Math.floor(Math.random() * 3) - 1; 

  correctNote = {
    name: base.name,
    freq: base.freq * Math.pow(2, oct),
    y: (currentClef === 'treble' ? base.trebleY : base.bassY) - (oct * 70)
  };
  
  drawStaff();
  createChoiceButtons();
}

// 選択肢ボタンの生成部分を共通関数化
function createChoiceButtons() {
  const div = document.getElementById("choices");
  div.innerHTML = "";
  ["ド","レ","ミ","ファ","ソ","ラ","シ"].forEach(name => {
    const btn = document.createElement("button");
    btn.innerText = name;
    btn.style.padding = "20px 30px";  
    btn.style.fontSize = "22px";      
    btn.onclick = () => checkAnswer(name);
    div.appendChild(btn);
  });
}

function drawStaff() {
  const canvas = document.getElementById("staff");
  const ctx = canvas.getContext("2d");
  ctx.clearRect(0,0,600,220);
  ctx.strokeStyle="#333";
  ctx.lineWidth = 2;
  
  for(let i=0; i<5; i++){
    ctx.beginPath(); ctx.moveTo(50, 60+i*20); ctx.lineTo(550, 60+i*20); ctx.stroke();
  }
  
  ctx.font="80px serif";
  ctx.fillStyle="black";
  ctx.fillText(currentClef === 'treble' ? "𝄞" : "𝄢", 60, currentClef === 'treble' ? 135 : 115);
  
  ctx.beginPath();
  ctx.fillStyle = "black";
  ctx.ellipse(300, correctNote.y, 10, 7, 0, 0, Math.PI*2);
  ctx.fill();

  ctx.strokeStyle = "black";
  for(let ly = 160; ly <= correctNote.y; ly += 20) {
    ctx.beginPath(); ctx.moveTo(280, ly); ctx.lineTo(320, ly); ctx.stroke();
  }
  for(let ly = 40; ly >= correctNote.y; ly -= 20) {
    ctx.beginPath(); ctx.moveTo(280, ly); ctx.lineTo(320, ly); ctx.stroke();
  }
}

function checkAnswer(name) {
  if (name === correctNote.name) {
    // 【正解時】緑フラッシュとその音階の音を再生
    triggerFlash('correct-flash');
    playTone(correctNote.freq);
    
    if (gameMode === 'exam') {
      score += 10; 
      comboCount++; 
      
      if (comboCount === 3) {
        timeLeft += 10.0;
        comboCount = 0; 
      }
      
      document.getElementById('score-display').innerText = `スコア: ${score}`;
      document.getElementById('combo-display').innerText = `コンボ: ${comboCount}`;
    }
    
    // 正解したので次の問題へ進む
    generateQuestion();

  } else {
    // 【不正解時】赤フラッシュ、コンボ消滅、警告音（問題は変えない）
    triggerFlash('wrong-flash');
    playWrongSound();
    
    if (gameMode === 'exam') {
      score -= 5; 
      if (score < 0) score = 0; 
      comboCount = 0; // 不正解でコンボが途切れる
      
      document.getElementById('score-display').innerText = `スコア: ${score}`;
      document.getElementById('combo-display').innerText = `コンボ: ${comboCount}`;
    }
    // generateQuestion()を呼ばないため、同じ問題が維持されます
  }
}

// 画面を一時的に光らせる演出
function triggerFlash(className) {
  document.body.classList.remove('correct-flash', 'wrong-flash');
  void document.body.offsetWidth; // リフローをトリガーしてアニメーションをリセット
  document.body.classList.add(className);
  setTimeout(() => {
    document.body.classList.remove(className);
  }, 150);
}

// 正解音（その音階の正解音を綺麗に鳴らす）
function playTone(freq){
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = "sine";
  osc.frequency.value = freq;
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start();
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
  osc.stop(audioCtx.currentTime + 0.5);
}

// 不正解音（ブブーという低い濁った音）
function playWrongSound() {
  const now = audioCtx.currentTime;
  const osc1 = audioCtx.createOscillator();
  const osc2 = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  
  osc1.type = "sawtooth"; 
  osc2.type = "sawtooth";
  
  osc1.frequency.setValueAtTime(130.81, now); // 低いド
  osc2.frequency.setValueAtTime(138.59, now); // 少しずらして濁らせる
  
  osc1.connect(gain); osc2.connect(gain);
  gain.connect(audioCtx.destination);
  
  gain.gain.setValueAtTime(0.15, now);
  gain.gain.linearRampToValueAtTime(0.001, now + 0.3);
  
  osc1.start(now); osc1.stop(now + 0.3);
  osc2.start(now); osc2.stop(now + 0.3);
}
</script>
</body>
</html>
