<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>譜読みマスター - 超中毒性Ver (動作安定化版)</title>
<style>
  body { 
    background:#101018; color:white; text-align:center; font-family:sans-serif; margin:0; padding:10px;
    transition: background-color 0.1s ease;
    overflow-x: hidden;
  }
  canvas { 
    background:white; border-radius: 8px; margin:10px auto; display: block;
    box-shadow: 0 0 25px rgba(255,255,255,0.15); 
    max-width: 100%; height: auto;
  }
  button { 
    margin:8px; padding:18px 28px; font-size: 20px; font-weight: bold; cursor: pointer;
    background: #4444ff; color: white; border: none; border-radius: 8px;
    transition: 0.15s;
    touch-action: manipulation;
    box-shadow: 0 4px 0 #2222aa;
  }
  button:hover { background: #6666ff; transform: translateY(-2px); box-shadow: 0 6px 0 #2222aa; }
  button:active { transform: translateY(2px); box-shadow: 0 0 0 #2222aa; }
  
  .screen { display: none; }
  .active { display: block; }
  .panel { margin:15px auto; padding: 20px; border: 1px solid #333; border-radius: 12px; background: #1a1a24; max-width: 600px; box-shadow: 0 8px 16px rgba(0,0,0,0.3); }
  .stats-grid { display: flex; justify-content: center; gap: 25px; margin-bottom: 10px; font-weight: bold; font-size: 1.4em; }
  .choice-container { display: flex; justify-content: center; flex-wrap: wrap; max-width: 600px; margin: 0 auto; gap: 5px; }
  .mode-title { font-size: 1.8em; font-weight: bold; margin-bottom: 15px; color: #ffaa00; }
  
  .menu-btn { font-size: 22px; padding: 20px 40px; margin: 10px; width: 85%; max-width: 320px; }
  
  .highscore-text { font-size: 1.1em; color: #ffcc00; font-weight: bold; margin-top: 5px; text-shadow: 0 0 8px rgba(255,204,0,0.4); }

  body.correct-flash-low { background-color: #0b2b0b; }
  body.correct-flash-mid { background-color: #114411; }
  body.correct-flash-high { background-color: #1b661b; }
  body.wrong-flash { background-color: #551111; }
  
  .badge { font-size: 4em; font-weight: bold; margin: 15px 0; text-shadow: 0 0 20px currentColor; display: inline-block; animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
  @keyframes popIn { 0% { transform: scale(0); } 100% { transform: scale(1); } }
</style>
</head>
<body>

<h1>🎶 譜読み練習サイト 🎶</h1>

<div id="screen-home" class="screen active">
  <div class="panel">
    <h2>メインメニュー</h2>
    <p style="font-size: 1.1em; color: #ccc;">練習したい記号とモードを選んでください。</p>
    
    <div style="margin-bottom: 25px;">
      <div style="font-size: 1.2em; font-weight: bold; margin-bottom: 10px;">音部記号の選択：</div>
      <button id="btn-clef-treble" onclick="selectClef('treble')" style="background: #ff55bb; font-size: 20px; padding: 15px 30px;">ト音記号</button>
      <button id="btn-clef-bass" onclick="selectClef('bass')" style="background: #555; font-size: 20px; padding: 15px 30px;">ヘ音記号</button>
      <div id="home-highscore" class="highscore-text">🏆 ハイスコア: 0</div>
    </div>

    <hr style="border-color: #333; margin: 25px 0;">

    <div style="display: flex; flex-direction: column; align-items: center;">
      <button onclick="startGameMode('exam')" class="menu-btn" style="background: #ff4444; box-shadow: 0 4px 0 #aa2222;">🔥 本番開始 (1分半)</button>
      <button onclick="startGameMode('practice')" class="menu-btn" style="background: #22cc22; box-shadow: 0 4px 0 #117711;">✏️ 練習開始 (制限なし)</button>
    </div>
  </div>
</div>

<div id="screen-game" class="screen">
  <div class="panel">
    <div id="game-mode-text" class="mode-title">モード</div>
    <div class="stats-grid">
      <div id="timer-display">残り時間: --</div>
      <div id="score-display">スコア: 0</div>
      <div id="combo-display" style="color: #00ffcc;">コンボ: 0</div>
    </div>
  </div>

  <canvas id="staff" width="600" height="220"></canvas>
  
  <div class="panel">
    <div id="mult-display" style="font-size: 1.2em; font-weight: bold; color: #ffcc00; margin-bottom: 5px; height: 24px;">獲得点数: +10</div>
    <div class="choice-container" id="choices"></div>
  </div>
  
  <button onclick="endGame()" style="background:#555; box-shadow:0 4px 0 #333; font-size: 18px; padding: 12px 24px; margin-top: 15px;">メニューに戻る</button>
</div>

<div id="screen-result" class="screen">
  <div class="panel">
    <h2 style="color: #ffaa00; font-size: 2em; margin-bottom: 5px;">TIME UP!</h2>
    <p id="result-clef-text" style="font-size: 1.2em; color: #aaa; margin: 5px 0;"></p>
    
    <div style="font-size: 1.5em; margin-top: 20px;">最終スコア</div>
    <div id="result-score" style="font-size: 3.5em; font-weight: bold; color: #fff;">0</div>
    <div id="result-highscore-notice" style="color: #ffcc00; font-weight: bold; display: none; margin-bottom: 10px;">🏆 ハイスコア更新！ 🏆</div>
    
    <div>評価ランク</div>
    <div id="result-badge" class="badge">A</div>
    <div id="result-comment" style="font-size: 1.2em; font-weight: bold; color: #aaa; margin-bottom: 25px;">素晴らしい演奏でした！</div>
    
    <div style="display: flex; flex-direction: column; align-items: center; gap: 10px;">
      <button onclick="startGameMode('exam')" style="background: #ff4444; box-shadow: 0 4px 0 #aa2222; width: 85%; max-width: 320px; font-size: 22px; padding: 15px;">🔄 もう一度挑戦する</button>
      <button onclick="showHomeScreen()" style="background: #555; box-shadow: 0 4px 0 #333; width: 85%; max-width: 320px; font-size: 18px; padding: 12px;">🏠 メインメニューへ</button>
    </div>
  </div>
</div>

<script>
let audioCtx = null;
let currentClef = 'treble'; 
let gameMode = 'exam';      
let gameActive = false;
let correctNote = null;

let score = 0;
let timeLeft = 0;
let lastTimestamp = 0;
let comboCount = 0; 
let animationFrameId = null; // ループアニメーション停止用のID管理

let juiceEffects = [];

const TREBLE_MAP = [
  { y: 160, name: "ド", freq: 261.63 }, 
  { y: 150, name: "レ", freq: 293.66 }, 
  { y: 140, name: "ミ", freq: 329.63 }, 
  { y: 130, name: "ファ",freq: 349.23 }, 
  { y: 120, name: "ソ", freq: 392.00 }, 
  { y: 110, name: "ラ", freq: 440.00 }, 
  { y: 100, name: "シ", freq: 493.88 }, 
  { y: 90,  name: "ド", freq: 523.25 }, 
  { y: 80,  name: "レ", freq: 587.33 }, 
  { y: 70,  name: "ミ", freq: 659.25 }, 
  { y: 60,  name: "ファ",freq: 698.46 }, 
  { y: 50,  name: "ソ", freq: 783.99 }, 
  { y: 40,  name: "ラ", freq: 880.00 }, 
  { y: 30,  name: "シ", freq: 987.77 }  
];

const BASS_MAP = [
  { y: 160, name: "ミ", freq: 82.41  }, 
  { y: 150, name: "ファ",freq: 87.31  }, 
  { y: 140, name: "ソ", freq: 98.00  }, 
  { y: 130, name: "ラ", freq: 110.00 }, 
  { y: 120, name: "シ", freq: 123.47 }, 
  { y: 110, name: "ド", freq: 130.81 }, 
  { y: 100, name: "レ", freq: 146.83 }, 
  { y: 90,  name: "ミ", freq: 164.81 }, 
  { y: 80,  name: "ファ",freq: 174.61 }, 
  { y: 70,  name: "ソ", freq: 196.00 }, 
  { y: 60,  name: "ラ", freq: 220.00 }, 
  { y: 50,  name: "シ", freq: 246.94 }, 
  { y: 40,  name: "ド", freq: 261.63 }, 
  { y: 30,  name: "レ", freq: 293.66 }  
];

function initAudio() { 
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); 
}

function showScreen(screenId) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(screenId).classList.add('active');
  gameActive = (screenId === 'screen-game');
}

function showHomeScreen() {
  stopGameLoop();
  updateHighscoreDisplay();
  showScreen('screen-home');
}

function updateHighscoreDisplay() {
  const key = `谱読みMaster_v4_highscore_${currentClef}`;
  const highscore = localStorage.getItem(key) || 0;
  document.getElementById('home-highscore').innerText = `🏆 ハイスコア: ${highscore}`;
}

function selectClef(clef) {
  currentClef = clef;
  const trebleBtn = document.getElementById('btn-clef-treble');
  const bassBtn = document.getElementById('btn-clef-bass');
  
  if (clef === 'treble') {
    trebleBtn.style.background = '#ff55bb';
    bassBtn.style.background = '#555';
  } else {
    trebleBtn.style.background = '#555';
    bassBtn.style.background = '#55bbff';
  }
  updateHighscoreDisplay();
}

function stopGameLoop() {
  if (animationFrameId) {
    cancelAnimationFrame(animationFrameId);
    animationFrameId = null;
  }
}

function startGameMode(mode) {
  stopGameLoop(); // 既存のループがあれば確実に停止
  initAudio();
  gameMode = mode;
  juiceEffects = [];
  
  const modeText = document.getElementById('game-mode-text');
  const timerDisp = document.getElementById('timer-display');
  const scoreDisp = document.getElementById('score-display');
  const comboDisp = document.getElementById('combo-display');
  const multDisp = document.getElementById('mult-display');
  
  if (gameMode === 'exam') {
    modeText.innerText = "🔥 本番モード";
    modeText.style.color = "#ff4444";
    score = 0;
    comboCount = 0;
    timeLeft = 90.0; 
    timerDisp.innerText = `残り時間: ${timeLeft.toFixed(1)}s`;
    scoreDisp.innerText = `スコア: ${score}`;
    comboDisp.innerText = `コンボ: ${comboCount}`;
    multDisp.innerText = `獲得点数: +10`;
    scoreDisp.style.display = "block";
    comboDisp.style.display = "block";
    multDisp.style.display = "block";
  } else {
    modeText.innerText = "✏️ 練習モード";
    modeText.style.color = "#22cc22";
    timerDisp.innerText = "残り時間: ∞";
    scoreDisp.style.display = "none";
    comboDisp.style.display = "none";
    multDisp.style.display = "none";
  }
  
  showScreen('screen-game');
  generateQuestion();
  
  lastTimestamp = performance.now();
  animationFrameId = requestAnimationFrame(gameLoop);
}

function gameLoop(timestamp) {
  if (!gameActive) return;
  
  const dt = timestamp - lastTimestamp;
  lastTimestamp = timestamp;

  if (gameMode === 'exam') {
    timeLeft -= dt / 1000;
    if (timeLeft <= 0) {
      timeLeft = 0;
      document.getElementById('timer-display').innerText = `残り時間: 0.0s`;
      processResult();
      return;
    }
    document.getElementById('timer-display').innerText = `残り時間: ${timeLeft.toFixed(1)}s`;
  }
  
  drawStaff();
  animationFrameId = requestAnimationFrame(gameLoop);
}

function processResult() {
  stopGameLoop(); // タイムアップ時にループを完全に止める
  gameActive = false;
  
  const key = `谱読みMaster_v4_highscore_${currentClef}`;
  const oldHigh = parseInt(localStorage.getItem(key) || 0, 10);
  let isNewHigh = false;
  if (score > oldHigh) {
    localStorage.setItem(key, score);
    isNewHigh = true;
  }
  
  document.getElementById('result-clef-text').innerText = currentClef === 'treble' ? "【 ト音記号コース 】" : "【 ヘ音記号コース 】";
  document.getElementById('result-score').innerText = score;
  document.getElementById('result-highscore-notice').style.display = isNewHigh ? "block" : "none";
  
  let rank = "F";
  let color = "#888888";
  let comment = "まずはじっくり練習モードで覚えよう！";
  
  if (score >= 400) { rank = "SSS"; color = "#ff0055"; comment = "神域の譜読み能力！向かうところ敵なしです！"; }
  else if (score >= 300) { rank = "SS"; color = "#ffaa00"; comment = "達人級！プロの演奏家クラスのスピードです！"; }
  else if (score >= 230) { rank = "S"; color = "#ffff00"; comment = "素晴らしい！圧倒的な譜読み速度です！"; }
  else if (score >= 170) { rank = "A"; color = "#00ffcc"; comment = "合格点！すらすら読めるようになってきましたね！"; }
  else if (score >= 110) { rank = "B"; color = "#00ff00"; comment = "いい調子！その調子でスコアを伸ばしましょう！"; }
  else if (score >= 60)  { rank = "C"; color = "#2288ff"; comment = "少しずつ迷わずに読める音が増えてきました！"; }
  else if (score >= 20)  { rank = "D"; color = "#aa55ff"; comment = "一歩一歩前進しています！何度も挑戦だ！"; }
  
  const badge = document.getElementById('result-badge');
  badge.innerText = rank;
  badge.style.color = color;
  document.getElementById('result-comment').innerText = comment;
  
  showScreen('screen-result');
}

function endGame() {
  gameActive = false;
  showHomeScreen();
}

function generateQuestion() {
  const map = (currentClef === 'treble') ? TREBLE_MAP : BASS_MAP;
  const targetData = map[Math.floor(Math.random() * map.length)];

  correctNote = {
    name: targetData.name,
    freq: targetData.freq,
    y: targetData.y
  };
  
  createChoiceButtons();
}

function createChoiceButtons() {
  const div = document.getElementById("choices");
  div.innerHTML = "";
  ["ド","レ","ミ","ファ","ソ","ラ","シ"].forEach(name => {
    const btn = document.createElement("button");
    btn.innerText = name;
    btn.style.padding = "20px 30px";  
    btn.style.fontSize = "22px";      
    btn.onclick = () => checkAnswer(name);
    div.appendChild(btn);
  });
}

function drawStaff() {
  const canvas = document.getElementById("staff");
  if (!canvas) return;
  const ctx = canvas.getContext("2d");
  ctx.clearRect(0,0,600,220);
  ctx.strokeStyle="#333";
  ctx.lineWidth = 2;
  
  for(let i=0; i<5; i++){
    ctx.beginPath(); ctx.moveTo(50, 60+i*20); ctx.lineTo(550, 60+i*20); ctx.stroke();
  }
  
  ctx.font="80px serif";
  ctx.fillStyle="black";
  ctx.fillText(currentClef === 'treble' ? "𝄞" : "𝄢", 60, currentClef === 'treble' ? 135 : 120);
  
  if (correctNote) {
    ctx.beginPath();
    ctx.fillStyle = "black";
    ctx.ellipse(300, correctNote.y, 10, 7, 0, 0, Math.PI*2);
    ctx.fill();

    ctx.strokeStyle = "black";
    ctx.lineWidth = 2;
    for(let ly = 160; ly <= correctNote.y; ly += 20) {
      ctx.beginPath(); ctx.moveTo(280, ly); ctx.lineTo(320, ly); ctx.stroke();
    }
    for(let ly = 40; ly >= correctNote.y; ly -= 20) {
      ctx.beginPath(); ctx.moveTo(280, ly); ctx.lineTo(320, ly); ctx.stroke();
    }
  }

  for (let i = juiceEffects.length - 1; i >= 0; i--) {
    let fx = juiceEffects[i];
    fx.y -= fx.vy;
    fx.vy *= 0.92; 
    fx.alpha -= 0.02;
    
    if (fx.alpha <= 0) {
      juiceEffects.splice(i, 1);
      continue;
    }
    
    ctx.font = `italic bold ${fx.size}px sans-serif`;
    ctx.fillStyle = fx.color;
    ctx.globalAlpha = fx.alpha;
    ctx.strokeStyle = "black";
    ctx.lineWidth = 4;
    ctx.strokeText(fx.text, fx.x, fx.y);
    ctx.fillText(fx.text, fx.x, fx.y);
  }
  ctx.globalAlpha = 1.0; 
}

function checkAnswer(name) {
  if (!correctNote) return;
  const multDisp = document.getElementById('mult-display');
  
  if (name === correctNote.name) {
    let addScore = 10 + (comboCount * 2);
    if (addScore > 50) addScore = 50;
    
    let flashClass = 'correct-flash-low';
    if (comboCount >= 10) flashClass = 'correct-flash-high';
    else if (comboCount >= 5) flashClass = 'correct-flash-mid';
    
    triggerFlash(flashClass);
    playTone(correctNote.freq);
    
    if (gameMode === 'exam') {
      score += addScore; 
      comboCount++; 
      
      addJuiceText(`+${addScore}!`, 300, correctNote.y - 15, "#ffcc00", 32);
      if (comboCount >= 2) {
        addJuiceText(`${comboCount} COMBO!`, 300, correctNote.y + 25, "#00ffcc", 22);
      }
      
      if (comboCount === 3) {
        timeLeft += 10.0;
        addJuiceText("+10秒!!", 120, 40, "#ff4444", 26);
        comboCount = 0; 
      }
      
      let nextAddScore = 10 + (comboCount * 2);
      if (nextAddScore > 50) nextAddScore = 50;
      multDisp.innerText = `獲得点数: +${nextAddScore}`;
      if(comboCount > 0) multDisp.innerText += ` (コンボボーナス中!)`;
      
      document.getElementById('score-display').innerText = `スコア: ${score}`;
      document.getElementById('combo-display').innerText = `コンボ: ${comboCount}`;
    } else {
      addJuiceText("正解!", 300, correctNote.y - 15, "#22cc22", 28);
    }
    generateQuestion();

  } else {
    triggerFlash('wrong-flash');
    playWrongSound();
    
    if (gameMode === 'exam') {
      score -= 5; 
      if (score < 0) score = 0; 
      comboCount = 0; 
      
      addJuiceText("-5", 300, correctNote.y - 15, "#ff4444", 28);
      multDisp.innerText = `獲得点数: +10`;
      
      document.getElementById('score-display').innerText = `スコア: ${score}`;
      document.getElementById('combo-display').innerText = `コンボ: ${comboCount}`;
    }
  }
}

function addJuiceText(text, x, y, color, size) {
  juiceEffects.push({
    text: text,
    x: x,
    y: y,
    vy: 5, 
    color: color,
    size: size,
    alpha: 1.0
  });
}

function triggerFlash(className) {
  document.body.classList.remove('correct-flash-low', 'correct-flash-mid', 'correct-flash-high', 'wrong-flash');
  void document.body.offsetWidth; 
  document.body.classList.add(className);
  setTimeout(() => {
    document.body.classList.remove(className);
  }, 120);
}

function playTone(freq){
  try {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = "sine";
    osc.frequency.value = freq;
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start();
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
    osc.stop(audioCtx.currentTime + 0.5);
  } catch (e) {
    console.log("Audio Error:", e);
  }
}

function playWrongSound() {
  try {
    const now = audioCtx.currentTime;
    const osc1 = audioCtx.createOscillator();
    const osc2 = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    
    osc1.type = "sawtooth"; 
    osc2.type = "sawtooth";
    
    osc1.frequency.setValueAtTime(130.81, now); 
    osc2.frequency.setValueAtTime(138.59, now); 
    
    osc1.connect(gain); osc2.connect(gain);
    gain.connect(audioCtx.destination);
    
    gain.gain.setValueAtTime(0.15, now);
    gain.gain.linearRampToValueAtTime(0.001, now + 0.3);
    
    osc1.start(now); osc1.stop(now + 0.3);
    osc2.start(now); osc2.stop(now + 0.3);
  } catch (e) {
    console.log("Audio Error:", e);
  }
}

updateHighscoreDisplay();
</script>
</body>
</html>
