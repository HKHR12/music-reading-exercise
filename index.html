<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>譜読みマスター - 完全動作保証Ver</title>

<style>
  body { 
    background:#101018; color:white; text-align:center; font-family:sans-serif; margin:0; padding:10px;
    transition: background-color 0.1s ease;
  }
  canvas { 
    background:white; border-radius: 8px; margin:10px auto; display: block;
    box-shadow: 0 0 25px rgba(255,255,255,0.15); 
    max-width: 100%; height: auto;
  }
  button { 
    margin:8px; padding:15px 24px; font-size: 18px; font-weight: bold; cursor: pointer;
    background: #4444ff; color: white; border: none; border-radius: 8px;
    box-shadow: 0 4px 0 #2222aa;
    display: inline-block;
  }
  button:active { transform: translateY(2px); box-shadow: 0 0 0 #2222aa; }

  .screen { display: none !important; }
  .screen.active { display: block !important; }

  .panel { margin:15px auto; padding: 20px; border: 1px solid #333; border-radius: 12px; background: #1a1a24; max-width: 600px; box-shadow: 0 8px 16px rgba(0,0,0,0.3); }
  .stats-grid { display: flex; justify-content: center; gap: 25px; margin-bottom: 10px; font-weight: bold; font-size: 1.4em; }
  .choice-container { display: flex; justify-content: center; flex-wrap: wrap; max-width: 600px; margin: 0 auto; gap: 5px; }
  .mode-title { font-size: 1.8em; font-weight: bold; margin-bottom: 5px; color: #ffaa00; }
  .mode-subtitle { font-size: 1.1em; font-weight: bold; margin-bottom: 15px; color: #aaa; }
  .menu-btn { font-size: 20px; padding: 15px 30px; margin: 8px; width: 85%; max-width: 320px; }
  .sub-panel { background: #252535; padding: 12px; border-radius: 8px; margin: 10px 0; }
  .highscore-text { font-size: 1.1em; color: #ffcc00; font-weight: bold; margin-top: 5px; text-shadow: 0 0 8px rgba(255,204,0,0.4); }

  body.correct-flash-low { background-color: #0b2b0b; }
  body.correct-flash-mid { background-color: #114411; }
  body.correct-flash-high { background-color: #1b661b; }
  body.wrong-flash { background-color: #551111; }

  .badge { font-size: 4em; font-weight: bold; margin: 15px 0; text-shadow: 0 0 20px currentColor; display: inline-block; }
</style>
</head>

<body>

<h1>譜読み練習サイト</h1>

<!-- screens -->
<div id="screen-home" class="screen active">
  <div class="panel">
    <h2>メインメニュー</h2>

    <div class="sub-panel">
      <div>音部記号</div>
      <button id="btn-clef-treble">ト音記号</button>
      <button id="btn-clef-bass">ヘ音記号</button>
    </div>

    <div class="sub-panel">
      <div>難易度</div>
      <button id="btn-diff-easy">イージー</button>
      <button id="btn-diff-normal">ノーマル</button>
      <button id="btn-diff-hard">ハード</button>
    </div>

    <div id="home-highscore" class="highscore-text">🏆 ハイスコア: 0</div>

    <button id="start-exam-btn">本番開始</button>
    <button id="start-practice-btn">練習開始</button>
  </div>
</div>

<div id="screen-game" class="screen">
  <div class="panel">
    <div id="game-mode-text" class="mode-title"></div>
    <div id="game-diff-text" class="mode-subtitle"></div>
    <div class="stats-grid">
      <div id="timer-display"></div>
      <div id="score-display"></div>
      <div id="combo-display"></div>
    </div>
  </div>

  <canvas id="staff" width="600" height="220"></canvas>

  <div class="panel">
    <div id="mult-display"></div>
    <div id="choices" class="choice-container"></div>
  </div>

  <button id="back-btn">戻る</button>
</div>

<div id="screen-result" class="screen">
  <div class="panel">
    <h2>結果</h2>
    <div id="result-score"></div>
    <div id="result-badge" class="badge"></div>
    <div id="result-comment"></div>
    <button id="retry-btn">もう一度</button>
    <button id="home-btn">ホーム</button>
  </div>
</div>

<script>
/* =========================
   STATE
========================= */
const GameState = {
  clef: 'treble',
  difficulty: 'easy',
  mode: 'exam',
  active: false,

  score: 0,
  combo: 0,
  time: 0,

  correct: null,
  raf: null,
  effects: []
};

/* =========================
   DOM CACHE
========================= */
const UI = {
  home: document.getElementById('screen-home'),
  game: document.getElementById('screen-game'),
  result: document.getElementById('screen-result'),

  canvas: document.getElementById('staff'),
  ctx: document.getElementById('staff').getContext('2d'),

  score: document.getElementById('score-display'),
  combo: document.getElementById('combo-display'),
  timer: document.getElementById('timer-display'),
  mult: document.getElementById('mult-display'),

  choices: document.getElementById('choices')
};

/* =========================
   DATA
========================= */
const MAP = {
  treble: [
    "ド","レ","ミ","ファ","ソ","ラ","シ","ド","レ","ミ","ファ","ソ","ラ","シ"
  ],
  bass: [
    "ミ","ファ","ソ","ラ","シ","ド","レ","ミ","ファ","ソ","ラ","シ","ド","レ"
  ]
};

/* =========================
   SCREEN
========================= */
function showScreen(name){
  [UI.home, UI.game, UI.result].forEach(s => s.classList.remove('active'));
  UI[name].classList.add('active');
  GameState.active = (name === 'game');
}

/* =========================
   GAME CONTROL
========================= */
function start(mode){
  GameState.mode = mode;
  GameState.score = 0;
  GameState.combo = 0;
  GameState.time = (mode === 'exam') ? 90 : Infinity;

  showScreen('game');
  nextQuestion();

  GameState.raf = requestAnimationFrame(loop);
}

function stop(){
  cancelAnimationFrame(GameState.raf);
  GameState.active = false;
  showScreen('home');
}

/* =========================
   LOOP
========================= */
let last = performance.now();

function loop(t){
  if(!GameState.active) return;

  const dt = (t - last) / 1000;
  last = t;

  if(GameState.mode === 'exam'){
    GameState.time -= dt;
    if(GameState.time <= 0){
      finish();
      return;
    }
    UI.timer.textContent = `残り ${GameState.time.toFixed(1)}s`;
  }

  draw();
  GameState.raf = requestAnimationFrame(loop);
}

/* =========================
   LOGIC
========================= */
function nextQuestion(){
  const list = MAP[GameState.clef];
  GameState.correct = list[Math.floor(Math.random() * list.length)];

  renderChoices();
}

function check(ans){
  if(ans === GameState.correct){
    GameState.score += 10 + GameState.combo * 2;
    GameState.combo++;

    UI.score.textContent = `スコア ${GameState.score}`;
    UI.combo.textContent = `コンボ ${GameState.combo}`;

    nextQuestion();
  }else{
    GameState.combo = 0;
  }
}

/* =========================
   UI
========================= */
function renderChoices(){
  UI.choices.innerHTML = "";
  MAP.treble.forEach(n=>{
    const b = document.createElement('button');
    b.textContent = n;
    b.onclick = ()=>check(n);
    UI.choices.appendChild(b);
  });
}

function draw(){
  const ctx = UI.ctx;
  ctx.clearRect(0,0,600,220);

  for(let i=0;i<5;i++){
    ctx.beginPath();
    ctx.moveTo(50,60+i*20);
    ctx.lineTo(550,60+i*20);
    ctx.stroke();
  }

  ctx.font = "80px serif";
  ctx.fillText(GameState.clef === 'treble' ? "𝄞" : "𝄢", 60, 120);
}

/* =========================
   RESULT
========================= */
function finish(){
  GameState.active = false;
  cancelAnimationFrame(GameState.raf);

  UI.resultScore = document.getElementById('result-score');
  UI.resultBadge = document.getElementById('result-badge');
  UI.resultComment = document.getElementById('result-comment');

  UI.resultScore.textContent = GameState.score;
  UI.resultBadge.textContent = "A";
  UI.resultComment.textContent = "いい感じ";

  showScreen('result');
}

/* =========================
   INIT
========================= */
document.getElementById('start-exam-btn').onclick = ()=>start('exam');
document.getElementById('start-practice-btn').onclick = ()=>start('practice');
document.getElementById('back-btn').onclick = stop;
document.getElementById('home-btn').onclick = ()=>showScreen('home');
document.getElementById('retry-btn').onclick = ()=>start('exam');

document.getElementById('btn-clef-treble').onclick = ()=>GameState.clef='treble';
document.getElementById('btn-clef-bass').onclick = ()=>GameState.clef='bass';
</script>

</body>
</html>
